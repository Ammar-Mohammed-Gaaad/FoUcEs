<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي - فكرني</title>
    <link href="https://fonts.googleapis.com/css?family=Cairo:400,600,700,800|Poppins:400,500,600,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    
    <style>
        :root {
            --primary: #2563eb;
            --primary-light: #3b82f6;
            --secondary: #00d26a;
            --secondary-hover: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .container { max-width: 900px; margin: 40px auto; padding: 20px; }

        /* Header */
        .page-header {
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .back-btn {
            background: var(--bg-color);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            cursor: pointer;
            transition: 0.2s;
            font-size: 24px;
        }

        .back-btn:hover {
            background: #e2e8f0;
            color: var(--primary);
        }

        .page-header h1 {
            font-size: 32px;
            font-weight: 800;
            color: var(--text-main);
        }

        /* Profile Card */
        .profile-card {
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid var(--border-color);
            padding: 40px;
            box-shadow: var(--shadow-md);
            margin-bottom: 30px;
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 30px;
            margin-bottom: 40px;
            padding-bottom: 40px;
            border-bottom: 1px solid var(--border-color);
        }

        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: var(--primary-light);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 48px;
            font-weight: bold;
            flex-shrink: 0;
            box-shadow: var(--shadow-md);
        }

        .profile-info h2 {
            font-size: 28px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .profile-info p {
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 5px;
        }

        /* Info Grid */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .info-item {
            background: var(--bg-color);
            padding: 20px;
            border-radius: 15px;
            border-left: 4px solid var(--primary);
        }

        .info-label {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .info-value {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-main);
        }

        /* Form Section */
        .form-section {
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid var(--border-color);
            padding: 40px;
            box-shadow: var(--shadow-md);
            margin-bottom: 30px;
        }

        .form-section h3 {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 10px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 14px;
            font-family: 'Cairo', sans-serif;
            transition: all 0.2s;
            background: var(--bg-color);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        /* Buttons */
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: var(--shadow-sm);
        }

        .btn-primary:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            background: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: #f1f5f9;
            border-color: var(--primary);
            color: var(--primary);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            width: 100%;
            margin-top: 30px;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: var(--danger);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Loading State */
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }

        /* Success Message */
        .alert {
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideIn 0.3s ease;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .container { padding: 15px; }
            .profile-card { padding: 25px; }
            .form-section { padding: 25px; }
            .profile-header { flex-direction: column; text-align: center; }
            .info-grid { grid-template-columns: 1fr; }
            .button-group { grid-template-columns: 1fr; }
            .page-header { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header with Back Button -->
        <div class="page-header">
            <button class="back-btn" onclick="goBack()" title="رجوع">
                <span class="material-icons-outlined">arrow_forward</span>
            </button>
            <div>
                <h1>الملف الشخصي</h1>
            </div>
        </div>

        <!-- Alert Messages -->
        <div id="successAlert" class="alert alert-success" style="display: none;">
            <span class="material-icons-outlined">check_circle</span>
            <span id="successMessage"></span>
        </div>
        <div id="errorAlert" class="alert alert-error" style="display: none;">
            <span class="material-icons-outlined">error</span>
            <span id="errorMessage"></span>
        </div>

        <!-- Profile Information Card -->
        <div class="profile-card">
            <div class="profile-header">
                <div class="profile-avatar" id="profileAvatar">👤</div>
                <div class="profile-info">
                    <h2 id="username">جاري التحميل...</h2>
                    <p id="email">جاري تحميل البريد الإلكتروني...</p>
                    <p style="margin-top: 10px; font-size: 13px;">عضو منذ <span id="joinDate">-</span></p>
                </div>
            </div>

            <!-- Info Grid -->
            <div class="info-grid">
                <div class="info-item">
                    <div class="info-label">📊 عدد المهام</div>
                    <div class="info-value" id="taskCount">0</div>
                </div>
                <div class="info-item">
                    <div class="info-label">✅ المهام المكتملة</div>
                    <div class="info-value" id="completedTasks">0</div>
                </div>
                <div class="info-item">
                    <div class="info-label">🎯 عدد الأهداف</div>
                    <div class="info-value" id="goalCount">0</div>
                </div>
                <div class="info-item">
                    <div class="info-label">⏳ حالة الإنترفيو</div>
                    <div class="info-value" id="interviewStatus">قيد الإنجاز</div>
                </div>
            </div>
        </div>

        <!-- Edit Profile Form -->
        <div class="form-section">
            <h3>
                <span class="material-icons-outlined">edit</span>
                تعديل البيانات الشخصية
            </h3>

            <div class="form-group">
                <label for="newName">الاسم الكامل</label>
                <input type="text" id="newName" placeholder="أدخل اسمك الجديد">
            </div>

            <div class="form-group">
                <label for="newEmail">البريد الإلكتروني</label>
                <input type="email" id="newEmail" placeholder="أدخل بريدك الإلكتروني الجديد">
            </div>

            <div class="button-group">
                <button class="btn btn-primary" onclick="updateProfile()" id="saveBtn">
                    <span class="material-icons-outlined">save</span>
                    حفظ التعديلات
                </button>
                <button class="btn btn-secondary" onclick="resetForm()">
                    <span class="material-icons-outlined">refresh</span>
                    إلغاء
                </button>
            </div>
        </div>

        <!-- Danger Zone -->
        <div class="form-section">
            <h3 style="color: var(--danger);">
                <span class="material-icons-outlined">warning</span>
                منطقة الخطر
            </h3>
            <p style="color: var(--text-muted); margin-bottom: 20px;">تسجيل الخروج من حسابك في فكرني. ستحتاج لتسجيل الدخول مرة أخرى.</p>
            <button class="btn btn-danger" onclick="logout()">
                <span class="material-icons-outlined">logout</span>
                تسجيل خروج
            </button>
        </div>
    </div>

    <script>
        // ===== INITIALIZE =====
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('📥 تحميل صفحة الملف الشخصي...');
            
            const token = localStorage.getItem("token") || localStorage.getItem("access_token");
            if (!token) {
                console.warn('❌ لا توجد جلسة - تحويل للدخول');
                window.location.href = "/login.html";
                return;
            }
            
            await loadProfile();
        });

        // ===== LOAD PROFILE =====
        async function loadProfile() {
            try {
                const token = localStorage.getItem("token") || localStorage.getItem("access_token");
                
                // جلب بيانات البروفايل
                const response = await fetch("/api/learning/my-profile", {
                    method: "GET",
                    headers: {
                        "Authorization": `Bearer ${token}`,
                        "Content-Type": "application/json"
                    }
                });

                if (!response.ok) {
                    if (response.status === 401) {
                        window.location.href = "/login.html";
                        return;
                    }
                    throw new Error("فشل في تحميل البيانات");
                }

                const data = await response.json();
                console.log('✅ تم تحميل البيانات:', data);
                
                // تحديث واجهة المستخدم
                updateProfileUI(data);
                
            } catch (error) {
                console.error('❌ خطأ:', error);
                showError('خطأ في التحميل', error.message);
            }
        }

        // ===== UPDATE UI =====
        function updateProfileUI(data) {
            const name = data.name || data.full_name || 'يا صاحبي';
            const email = data.email || 'لم يتم تعيين بريد إلكتروني';
            
            // تحديث البيانات الأساسية
            document.getElementById("username").innerText = name;
            document.getElementById("email").innerText = email;
            
            // تحديث الإحصائيات
            document.getElementById("taskCount").innerText = data.task_count || 0;
            document.getElementById("completedTasks").innerText = data.completed_tasks || 0;
            document.getElementById("goalCount").innerText = data.goal_count || 0;
            document.getElementById("interviewStatus").innerText = data.completed_interview ? '✅ مكتملة' : '⏳ قيد الإنجاز';
            
            // تحديث تاريخ الانضمام
            if (data.created_at) {
                const date = new Date(data.created_at);
                document.getElementById("joinDate").innerText = date.toLocaleDateString('ar-EG');
            }
            
            // تحديث الـ Avatar
            const firstLetter = name.charAt(0).toUpperCase();
            document.getElementById("profileAvatar").innerText = firstLetter;
            
            // تحديث localStorage
            localStorage.setItem('user_name', name);
            localStorage.setItem('user_email', email);
        }

        // ===== UPDATE PROFILE =====
        async function updateProfile() {
            const newName = document.getElementById("newName").value.trim();
            const newEmail = document.getElementById("newEmail").value.trim();
            
            if (!newName && !newEmail) {
                showError('تنبيه', 'أدخل على الأقل اسماً أو بريداً إلكترونياً');
                return;
            }
            
            // التحقق من صحة البريد
            if (newEmail && !validateEmail(newEmail)) {
                showError('بريد غير صحيح', 'الرجاء إدخال بريد إلكتروني صحيح');
                return;
            }

            try {
                const token = localStorage.getItem("token") || localStorage.getItem("access_token");
                const saveBtn = document.getElementById("saveBtn");
                
                saveBtn.disabled = true;
                saveBtn.innerText = '⏳ جاري الحفظ...';

                const response = await fetch("/api/learning/my-profile", {
                    method: "PUT",
                    headers: {
                        "Authorization": `Bearer ${token}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        name: newName || undefined,
                        email: newEmail || undefined
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || 'فشل التحديث');
                }

                showSuccess('نجاح!', 'تم تحديث بيانات حسابك بنجاح');
                
                // إعادة تحميل البيانات
                await loadProfile();
                
                // مسح خانات الإدخال
                document.getElementById("newName").value = '';
                document.getElementById("newEmail").value = '';

            } catch (error) {
                console.error('❌ خطأ:', error);
                showError('خطأ في التحديث', error.message);
            } finally {
                const saveBtn = document.getElementById("saveBtn");
                saveBtn.disabled = false;
                saveBtn.innerText = '💾 حفظ التعديلات';
            }
        }

        // ===== RESET FORM =====
        function resetForm() {
            document.getElementById("newName").value = '';
            document.getElementById("newEmail").value = '';
        }

        // ===== LOGOUT =====
        function logout() {
            if (confirm('هل أنت متأكد من رغبتك في تسجيل الخروج؟')) {
                localStorage.removeItem('token');
                localStorage.removeItem('access_token');
                localStorage.removeItem('user_name');
                localStorage.removeItem('user_email');
                localStorage.removeItem('user_id');
                window.location.href = '/';
            }
        }

        // ===== GO BACK =====
        function goBack() {
            window.history.back();
        }

        // ===== EMAIL VALIDATION =====
        function validateEmail(email) {
            const re = /^(([^<>()[\]\\.,;:\s@"]+(\.[^<>()[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/;
            return re.test(String(email).toLowerCase());
        }

        // ===== ALERTS =====
        function showSuccess(title, message) {
            const alert = document.getElementById('successAlert');
            document.getElementById('successMessage').innerText = `${title}: ${message}`;
            alert.style.display = 'flex';
            setTimeout(() => {
                alert.style.display = 'none';
            }, 5000);
        }

        function showError(title, message) {
            const alert = document.getElementById('errorAlert');
            document.getElementById('errorMessage').innerText = `${title}: ${message}`;
            alert.style.display = 'flex';
            setTimeout(() => {
                alert.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
