<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي - فكرني</title>
    <link href="https://fonts.googleapis.com/css?family=Cairo:400,600,700,800|Poppins:400,500,600,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css?v=3">
    
    <link rel="stylesheet" href="../css/profile.css?v=3">
    <script src="../js/i18n.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header with Back Button and Dark Mode -->
        <div class="page-header">
            <div style="display: flex; align-items: center; gap: 15px; width: 100%;">
                <button class="back-btn" data-action="goBack" title="رجوع" type="button">
                    <span class="material-icons-outlined">arrow_forward</span>
                </button>
                <div>
                    <h1 data-i18n="nav_profile">الملف الشخصي</h1>
                </div>
                <div style="margin-left: auto; display: flex; gap: 8px;">
                    <button class="back-btn" title="تغيير اللغة" type="button" onclick="toggleLanguage()" style="font-size: 18px;" data-i18n="btn_language_icon">🌍</button>
                    <button id="darkModeToggleProfile" class="back-btn" title="تبديل الوضع المظلم" type="button">
                        <span class="material-icons-outlined">dark_mode</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Alert Messages -->
        <div id="successAlert" class="alert alert-success" style="display: none;">
            <span class="material-icons-outlined">check_circle</span>
            <span id="successMessage"></span>
        </div>
        <div id="errorAlert" class="alert alert-error" style="display: none;">
            <span class="material-icons-outlined">error</span>
            <span id="errorMessage"></span>
        </div>

        <!-- Profile Information Card -->
        <div class="profile-card">
            <div class="profile-header">
                <div class="profile-avatar" id="profileAvatar">👤</div>
                <div class="profile-info">
                    <h2 id="username">جاري التحميل...</h2>
                    <p id="email">جاري تحميل البريد الإلكتروني...</p>
                    <p style="margin-top: 10px; font-size: 13px;">عضو منذ <span id="joinDate">-</span></p>
                </div>
            </div>

            <!-- Info Grid -->
            <div class="info-grid">
                <div class="info-item">
                    <div class="info-label" data-i18n="prof_task_count">📊 عدد المهام</div>
                    <div class="info-value" id="taskCount">0</div>
                </div>
                <div class="info-item">
                    <div class="info-label" data-i18n="prof_completed">✅ المهام المكتملة</div>
                    <div class="info-value" id="completedTasks">0</div>
                </div>
                <div class="info-item">
                    <div class="info-label" data-i18n="prof_goals">🎯 عدد الأهداف</div>
                    <div class="info-value" id="goalCount">0</div>
                </div>
                <div class="info-item">
                    <div class="info-label" data-i18n="prof_interview">⏳ حالة الإنترفيو</div>
                    <div class="info-value" id="interviewStatus">قيد الإنجاز</div>
                </div>
            </div>
        </div>

        <!-- Edit Profile Form -->
        <div class="form-section">
            <h3>
                <span class="material-icons-outlined">edit</span>
                <span data-i18n="prof_edit_info">تعديل البيانات الشخصية</span>
            </h3>

            <div class="form-group">
                <label for="newName" data-i18n="lbl_fullname">الاسم الكامل</label>
                <input type="text" id="newName" placeholder="أدخل اسمك الجديد" data-i18n-placeholder="prof_name_placeholder">
            </div>

            <div class="form-group">
                <label for="newEmail" data-i18n="lbl_email">البريد الإلكتروني</label>
                <input type="email" id="newEmail" placeholder="أدخل بريدك الإلكتروني الجديد" data-i18n-placeholder="prof_email_placeholder">
            </div>

            <div class="button-group">
                <button class="btn btn-primary" data-action="updateProfile" id="saveBtn" type="button">
                    <span class="material-icons-outlined">save</span>
                    <span data-i18n="prof_save">حفظ التعديلات</span>
                </button>
                <button class="btn btn-secondary" data-action="resetForm" type="button">
                    <span class="material-icons-outlined">refresh</span>
                    <span data-i18n="prof_cancel">إلغاء</span>
                </button>
            </div>
        </div>

        <!-- Danger Zone -->
        <div class="form-section">
            <h3 style="color: var(--danger);">
                <span class="material-icons-outlined">warning</span>
                <span data-i18n="prof_danger_zone">منطقة الخطر</span>
            </h3>
            <p style="color: var(--text-muted); margin-bottom: 20px;" data-i18n="prof_danger_desc">تسجيل الخروج من حسابك في فكرني. ستحتاج لتسجيل الدخول مرة أخرى.</p>
            <button class="btn btn-danger" data-action="logout" type="button">
                <span class="material-icons-outlined">logout</span>
                <span data-i18n="prof_logout">تسجيل خروج</span>
            </button>
        </div>
    </div>

    <script>
        // ===== Action Handlers for ButtonManager =====
        const profileActions = {
            goBack: () => window.history.back(),
            updateProfile: updateProfile,
            resetForm: resetForm,
            logout: logout
        };

        // ===== DARK MODE TOGGLE =====
        const darkModeToggleProfile = document.getElementById('darkModeToggleProfile');
        const body = document.body;

        function applyTheme(theme) {
            console.log('🎨 [Profile] Applying theme:', theme);
            if (theme === 'dark') {
                body.classList.add('dark-mode');
                darkModeToggleProfile.innerHTML = '<span class="material-icons-outlined">light_mode</span>';
                console.log('✅ [Profile] Dark mode enabled');
            } else {
                body.classList.remove('dark-mode');
                darkModeToggleProfile.innerHTML = '<span class="material-icons-outlined">dark_mode</span>';
                console.log('✅ [Profile] Light mode enabled');
            }
            localStorage.setItem('theme', theme);
            // Notify other pages of theme change
            window.dispatchEvent(new StorageEvent('storage', { key: 'theme', newValue: theme }));
        }

        // Load saved theme on page load
        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme') || 'light';
            console.log('🎨 [Profile] Loading saved theme:', savedTheme);
            applyTheme(savedTheme);
        });

        // Listen for dark mode toggle
        darkModeToggleProfile.addEventListener('click', () => {
            console.log('🌓 [Profile] Dark mode toggle clicked');
            const currentTheme = localStorage.getItem('theme') || 'light';
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            console.log('🌓 [Profile] Switching from', currentTheme, 'to', newTheme);
            applyTheme(newTheme);
        });

        // Listen for theme changes from other pages
        window.addEventListener('storage', (event) => {
            if (event.key === 'theme') {
                console.log('🔄 [Profile] Theme changed in another tab:', event.newValue);
                applyTheme(event.newValue || 'light');
            }
        });

        // ===== INITIALIZE =====
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('📥 [Profile] Page loaded, initializing...');
            
            const token = localStorage.getItem("token") || localStorage.getItem("access_token");
            if (!token) {
                console.warn('❌ [Profile] No authentication token - redirecting to login');
                window.location.href = "/login.html";
                return;
            }
            
            console.log('✅ [Profile] Found token, loading profile data...');
            await loadProfile();
            applyTheme(localStorage.getItem('theme') || 'light');
            console.log('✅ [Profile] Page fully initialized');
        });

        // ===== LOAD PROFILE =====
        async function loadProfile() {
            try {
                const token = localStorage.getItem("token") || localStorage.getItem("access_token");
                
                if (!token) {
                    throw new Error("No authentication token found");
                }
                
                console.log('🔄 [Profile] Fetching full profile from /api/learning/full-profile');
                
                // Fetch full profile
                const profileResponse = await fetch("/api/learning/full-profile", {
                    method: "GET",
                    headers: {
                        "Authorization": `Bearer ${token}`,
                        "Content-Type": "application/json"
                    }
                });

                if (!profileResponse.ok) {
                    if (profileResponse.status === 401) {
                        console.error('❌ [Profile] Unauthorized - token invalid');
                        window.location.href = "/login.html";
                        return;
                    }
                    const errData = await profileResponse.json().catch(() => ({}));
                    throw new Error(errData.detail || `HTTP ${profileResponse.status}`);
                }

                const profileData = await profileResponse.json();
                console.log('✅ [Profile] Learning profile loaded:', profileData);
                
                // Try to fetch tasks to get stats
                let taskStats = { task_count: 0, completed_tasks: 0 };
                try {
                    console.log('🔄 [Profile] Fetching tasks from /api/tasks/');
                    const tasksResponse = await fetch("/api/tasks/", {
                        method: "GET",
                        headers: {
                            "Authorization": `Bearer ${token}`,
                            "Content-Type": "application/json"
                        }
                    });
                    if (tasksResponse.ok) {
                        const tasks = await tasksResponse.json();
                        taskStats.task_count = tasks.length;
                        taskStats.completed_tasks = tasks.filter(t => t.status === 'completed').length;
                        console.log('✅ [Profile] Tasks loaded:', taskStats);
                    }
                } catch (e) {
                    console.warn('⚠️ [Profile] Could not fetch tasks:', e.message);
                }

                // Combine data
                const fullData = { ...profileData, ...taskStats, goal_count: 0 };
                
                // تحديث واجهة المستخدم
                updateProfileUI(fullData);
                
            } catch (error) {
                console.error('❌ [Profile] Error loading profile:', error);
                showError('خطأ في التحميل', error.message);
            }
        }

        // ===== UPDATE UI =====
        function updateProfileUI(data) {
            console.log('🎨 [Profile] Updating UI with data:', data);
            
            const name = data.name || data.full_name || 'يا صاحبي';
            const email = data.email || 'لم يتم تعيين بريد إلكتروني';
            
            // تحديث البيانات الأساسية
            document.getElementById("username").innerText = name;
            document.getElementById("email").innerText = email;
            console.log('✅ [Profile] Set name:', name, 'email:', email);
            
            // تحديث الإحصائيات
            document.getElementById("taskCount").innerText = data.task_count || 0;
            document.getElementById("completedTasks").innerText = data.completed_tasks || 0;
            document.getElementById("goalCount").innerText = data.goal_count || 0;
            const interviewStatus = data.completed_interview ? '✅ مكتملة' : '⏳ قيد الإنجاز';
            document.getElementById("interviewStatus").innerText = interviewStatus;
            console.log('✅ [Profile] Set statistics');
            
            // تحديث تاريخ الانضمام
            if (data.created_at) {
                const date = new Date(data.created_at);
                document.getElementById("joinDate").innerText = date.toLocaleDateString('ar-EG');
                console.log('✅ [Profile] Set join date:', date.toLocaleDateString('ar-EG'));
            }
            
            // تحديث الـ Avatar
            const firstLetter = name.charAt(0).toUpperCase();
            document.getElementById("profileAvatar").innerText = firstLetter;
            console.log('✅ [Profile] Set avatar:', firstLetter);
            
            // تحديث localStorage
            localStorage.setItem('user_name', name);
            localStorage.setItem('user_email', email);
            console.log('✅ [Profile] Updated localStorage');
        }

        // ===== UPDATE PROFILE =====
        async function updateProfile() {
            console.log('💾 [Profile] Update profile clicked');
            const newName = document.getElementById("newName").value.trim();
            const newEmail = document.getElementById("newEmail").value.trim();
            
            console.log('📝 [Profile] Form data:', { newName, newEmail });
            
            if (!newName && !newEmail) {
                console.warn('⚠️ [Profile] No data provided to update');
                showError('تنبيه', 'أدخل على الأقل اسماً أو بريداً إلكترونياً');
                return;
            }
            
            // التحقق من صحة البريد
            if (newEmail && !validateEmail(newEmail)) {
                console.warn('⚠️ [Profile] Invalid email format:', newEmail);
                showError('بريد غير صحيح', 'الرجاء إدخال بريد إلكتروني صحيح');
                return;
            }

            try {
                const token = localStorage.getItem("token") || localStorage.getItem("access_token");
                const saveBtn = document.getElementById("saveBtn");
                
                saveBtn.disabled = true;
                saveBtn.innerText = '⏳ جاري الحفظ...';
                console.log('🔄 [Profile] Sending PATCH request to /api/learning/user-profile');

                // Build request body with full_name (not name) for backend compatibility
                const requestBody = {};
                if (newName) requestBody.full_name = newName;
                if (newEmail) requestBody.email = newEmail;

                const response = await fetch("/api/learning/user-profile", {
                    method: "PATCH",
                    headers: {
                        "Authorization": `Bearer ${token}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(requestBody)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    console.error('❌ [Profile] API error:', errorData);
                    throw new Error(errorData.detail || 'فشل التحديث');
                }

                console.log('✅ [Profile] Update successful');
                showSuccess('نجاح!', 'تم تحديث بيانات حسابك بنجاح');
                
                // إعادة تحميل البيانات
                console.log('🔄 [Profile] Reloading profile after update');
                await loadProfile();
                
                // مسح خانات الإدخال
                document.getElementById("newName").value = '';
                document.getElementById("newEmail").value = '';
                console.log('✅ [Profile] Form cleared');

            } catch (error) {
                console.error('❌ [Profile] Error updating profile:', error);
                showError('خطأ في التحديث', error.message);
            } finally {
                const saveBtn = document.getElementById("saveBtn");
                saveBtn.disabled = false;
                saveBtn.innerText = '💾 حفظ التعديلات';
            }
        }

        // ===== RESET FORM =====
        function resetForm() {
            console.log('🔄 [Profile] Reset form clicked');
            document.getElementById("newName").value = '';
            document.getElementById("newEmail").value = '';
            console.log('✅ [Profile] Form cleared');
        }

        // ===== LOGOUT =====
        function logout() {
            console.log('👋 [Profile] Logout clicked');
            if (confirm('هل أنت متأكد من رغبتك في تسجيل الخروج؟')) {
                console.log('🔐 [Profile] User confirmed logout, clearing tokens');
                localStorage.removeItem('token');
                localStorage.removeItem('access_token');
                localStorage.removeItem('user_name');
                localStorage.removeItem('user_email');
                localStorage.removeItem('user_id');
                console.log('✅ [Profile] Tokens cleared, redirecting to home');
                window.location.href = '/';
            } else {
                console.log('⚠️ [Profile] User cancelled logout');
            }
        }

        // ===== GO BACK =====
        function goBack() {
            console.log('⬅️ [Profile] Going back');
            window.history.back();
        }

        // ===== EMAIL VALIDATION =====
        function validateEmail(email) {
            const re = /^(([^<>()[\]\\.,;:\s@"]+(\.[^<>()[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/;
            return re.test(String(email).toLowerCase());
        }

        // ===== ALERTS =====
        function showSuccess(title, message) {
            console.log('✅ [Profile] Success:', title, message);
            const alert = document.getElementById('successAlert');
            document.getElementById('successMessage').innerText = `${title}: ${message}`;
            alert.style.display = 'flex';
            setTimeout(() => {
                alert.style.display = 'none';
            }, 5000);
        }

        function showError(title, message) {
            console.error('❌ [Profile] Error:', title, message);
            const alert = document.getElementById('errorAlert');
            document.getElementById('errorMessage').innerText = `${title}: ${message}`;
            alert.style.display = 'flex';
            setTimeout(() => {
                alert.style.display = 'none';
            }, 5000);
        }

        // ===== INITIALIZE BUTTON MANAGER =====
        class ButtonManager {
            constructor(actionRegistry) {
                this.actionRegistry = actionRegistry;
                this.doubleClickTimeout = 600;
                this.debouncedElements = new WeakMap();
                this._bindGlobalClick();
                this._bindKeyboardAction();
            }

            _getActionTarget(target) {
                return target.closest('button, [data-action]');
            }

            _executeAction(target, event) {
                const action = target.dataset.action;
                if (!action) return false;

                const handler = this.actionRegistry[action];
                if (typeof handler !== 'function') {
                    console.warn('[ButtonManager] ⚠️ Action not found:', action);
                    return false;
                }

                if (this.debouncedElements.has(target)) {
                    console.log('[ButtonManager] ⏱️ Action debounced (too fast):', action);
                    return true;
                }

                console.log('[ButtonManager] ▶️ Executing action:', action);

                this.debouncedElements.set(target, true);
                setTimeout(() => this.debouncedElements.delete(target), this.doubleClickTimeout);

                target.classList.add('active');
                setTimeout(() => target.classList.remove('active'), 120);

                try {
                    handler(event, target);
                    console.log('[ButtonManager] ✅ Action completed:', action);
                } catch (err) {
                    console.error('[ButtonManager] ❌ Action error:', action, err);
                    showError('خطأ', 'حدث خطأ أثناء تنفيذ الإجراء');
                }

                return true;
            }

            _bindGlobalClick() {
                document.body.addEventListener('click', (event) => {
                    const target = this._getActionTarget(event.target);
                    if (!target || target.disabled) return;

                    if (this._executeAction(target, event)) {
                        event.preventDefault();
                        event.stopPropagation();
                    }
                }, true);
            }

            _bindKeyboardAction() {
                document.body.addEventListener('keydown', (event) => {
                    if (!['Enter', ' '].includes(event.key)) return;
                    const target = this._getActionTarget(event.target);
                    if (!target || target.disabled) return;

                    event.preventDefault();
                    target.click();
                }, true);
            }
        }

        // تفعيل ButtonManager عند تحميل الصفحة بالكامل
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🎯 [Profile] Initializing ButtonManager with actions:', Object.keys(profileActions).join(', '));
            const buttonManager = new ButtonManager(profileActions);
            console.log('✅ [Profile] ButtonManager initialized successfully');
        });
    </script>
</body>
</html>
