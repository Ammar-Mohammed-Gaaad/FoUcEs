<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعادة كلمة المرور - فكرني</title>
    <link rel="stylesheet" href="../css/styles.css?v=3">
    <link rel="stylesheet" href="../css/animations.css">
</head>
<body class="auth-page" style="display: flex; align-items: center; justify-content: center;">
    <div class="wrapper" style="max-width: 420px; padding: 40px 30px;">

        <div style="text-align: center; margin-bottom: 20px;">
            <button id="darkModeToggle" class="btn btn-secondary" style="padding: 8px 16px; font-size: 14px;">🌙 الوضع المظلم</button>
        </div>

        <div class="title-text">
            <div class="title login">استعادة المرور</div>
        </div>

        <p style="text-align: center; color: var(--text-muted); margin-bottom: 25px; font-size: 14px; line-height: 1.7;">
            أدخل بريدك الإلكتروني وسنرسل لك رابطاً لإعادة تعيين كلمة المرور.
        </p>

        <div class="form-container" style="overflow: visible;">
            <div class="form-inner" style="width: 100%; display: block; transform: none;">
                <form id="forgotForm" class="login" style="width: 100%; opacity: 1; pointer-events: auto;">
                    <div class="field">
                        <input type="email" id="resetEmail" required placeholder=" " dir="auto">
                        <label>البريد الإلكتروني</label>
                    </div>

                    <div class="field btn" style="margin-top: 25px;">
                        <div class="btn-layer"></div>
                        <input type="submit" value="إرسال رابط الاستعادة">
                    </div>

                    <div class="signup-link" style="margin-top: 20px; text-align: center;">
                        <a href="login.html" class="btn-forgot" style="display: inline-block; width: auto;">
                            ← رجوع لتسجيل الدخول
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="popup-overlay" id="customPopup">
        <div class="popup-content">
            <h2 id="popupTitle"></h2>
            <p id="popupMessage"></p>
            <button data-action="closePopup" type="button">تمام</button>
        </div>
    </div>

    <script>
        const darkModeToggle = document.getElementById('darkModeToggle');
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            darkModeToggle.textContent = '☀️ الوضع الفاتح';
        }
        darkModeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            darkModeToggle.textContent = isDark ? '☀️ الوضع الفاتح' : '🌙 الوضع المظلم';
        });

        function showPopup(title, msg) {
            document.getElementById('popupTitle').innerText = title;
            document.getElementById('popupMessage').innerText = msg;
            document.getElementById('customPopup').classList.add('active');
        }
        document.querySelector('[data-action="closePopup"]').addEventListener('click', () => {
            document.getElementById('customPopup').classList.remove('active');
        });

        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('resetEmail').value.trim();
            const submitBtn = e.target.querySelector('input[type="submit"]');
            submitBtn.value = 'جاري الإرسال...';
            submitBtn.disabled = true;

            // TODO: ربط بـ API عند جاهزيته → fetch('/api/auth/forgot-password', {...})
            setTimeout(() => {
                showPopup('تم الإرسال ✅', `لو كان الإيميل (${email}) مسجل عندنا، هتلاقي رابط الاستعادة في صندوق الوارد.`);
                submitBtn.value = 'إرسال رابط الاستعادة';
                submitBtn.disabled = false;
            }, 1500);
        });
    </script>
</body>
</html>
