<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - فكرني</title>
    <meta name="description" content="سجّل دخولك إلى فكرني واستمر رحلتك مع الذكاء الاصطناعي">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #6C3DE8;
            --primary-dark: #5028cc;
            --primary-light: #8B63F0;
            --accent: #a78bfa;
            --bg: #f0f0f0;
            --white: #ffffff;
            --text-dark: #1a1a2e;
            --text-muted: #666;
            --shadow: 0 20px 60px rgba(108, 61, 232, 0.2);
            --transition: 0.6s ease-in-out;
        }

        body {
            font-family: 'Cairo', 'Outfit', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(108, 61, 232, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(167, 139, 250, 0.1) 0%, transparent 50%);
        }

        /* ============ TOP-RIGHT TOOLBAR ============ */
        .toolbar {
            position: fixed;
            top: 18px;
            right: 18px;
            display: flex;
            gap: 10px;
            z-index: 1000;
        }

        .toolbar-btn {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(108,61,232,0.15);
            border-radius: 30px;
            padding: 8px 18px;
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            color: var(--primary);
            font-weight: 600;
            transition: all 0.25s ease;
            box-shadow: 0 2px 12px rgba(108,61,232,0.12);
        }

        .toolbar-btn:hover {
            background: var(--primary);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(108,61,232,0.3);
        }

        /* ============ MAIN CONTAINER ============ */
        .container {
            position: relative;
            background: var(--white);
            border-radius: 24px;
            box-shadow: var(--shadow);
            overflow: hidden;
            width: 820px;
            max-width: 100%;
            min-height: 520px;
            display: flex;
        }

        /* ============ FORM PANELS ============ */
        .form-box {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 40px;
            transition: left var(--transition), opacity var(--transition);
        }

        /* Login starts on right half, signup hidden off left edge */
        .form-box.login-box {
            left: 50%;
            opacity: 1;
            z-index: 2;
        }

        .form-box.signup-box {
            left: -50%;
            opacity: 0;
            z-index: 1;
        }

        /* === ACTIVE: overlay slides to right, forms shift === */
        .container.active .form-box.login-box {
            left: 150%;   /* slide off right edge */
            opacity: 0;
            z-index: 1;
        }

        .container.active .form-box.signup-box {
            left: 0;      /* slide into left half */
            opacity: 1;
            z-index: 2;
        }

        .form-content {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        /* LTR override for the whole form text */
        [dir="ltr"] .form-content {
            direction: ltr;
        }

        .form-content h1 {
            font-size: 28px;
            font-weight: 800;
            color: var(--text-dark);
            text-align: center;
            line-height: 1.2;
        }

        /* ---- Social Icons ---- */
        .social-row {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .social-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1.5px solid #e0e0e0;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s ease;
            font-size: 17px;
        }

        .social-btn:hover {
            border-color: var(--primary);
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(108,61,232,0.2);
        }

        .or-divider {
            font-size: 13px;
            color: var(--text-muted);
            letter-spacing: 0.05em;
        }

        /* ---- Inputs ---- */
        .input-group {
            width: 100%;
            position: relative;
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px;
            border: 1.5px solid #e0e0e0;
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            background: #f8f8ff;
            color: var(--text-dark);
            outline: none;
            transition: all 0.25s ease;
        }

        .input-group input:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(108,61,232,0.08);
        }

        .input-group input::placeholder {
            color: #aaa;
        }

        /* ---- Forgot link ---- */
        .forgot-link {
            align-self: flex-start;
            font-size: 13px;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
            cursor: pointer;
        }

        .forgot-link:hover {
            color: var(--primary);
        }

        /* ---- Submit Button ---- */
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            letter-spacing: 0.04em;
            transition: all 0.3s ease;
            box-shadow: 0 4px 18px rgba(108,61,232,0.35);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(108,61,232,0.45);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        /* ---- Password Strength ---- */
        .pwd-strength {
            font-size: 12px;
            margin-top: -12px;
            width: 100%;
            display: none;
            transition: 0.3s;
        }

        /* ============ SLIDING OVERLAY ============ */
        .overlay-box {
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 100%;
            background: linear-gradient(145deg, var(--primary-dark) 0%, var(--primary) 50%, var(--primary-light) 100%);
            z-index: 10;
            border-radius: 0 20px 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 50px 40px;
            gap: 20px;
            text-align: center;
            transition: all var(--transition);
            overflow: hidden;
        }

        /* Subtle background pattern on overlay */
        .overlay-box::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255,255,255,0.06);
            border-radius: 50%;
            top: -60px;
            right: -60px;
            pointer-events: none;
        }

        .overlay-box::after {
            content: '';
            position: absolute;
            width: 200px;
            height: 200px;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
            bottom: -40px;
            left: -40px;
            pointer-events: none;
        }

        .container.active .overlay-box {
            left: 50%;
            border-radius: 20px 0 0 20px;
        }

        .overlay-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .overlay-panel {
            display: none;
        }

        .overlay-panel.show {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .overlay-logo {
            font-size: 42px;
            margin-bottom: 4px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .overlay-box h2 {
            font-size: 28px;
            font-weight: 800;
            color: #fff;
            line-height: 1.2;
        }

        .overlay-box p {
            font-size: 14px;
            color: rgba(255,255,255,0.85);
            line-height: 1.7;
            max-width: 240px;
        }

        .overlay-toggle-btn {
            background: transparent;
            border: 2px solid #fff;
            color: #fff;
            padding: 11px 32px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            letter-spacing: 0.08em;
            transition: all 0.3s ease;
        }

        .overlay-toggle-btn:hover {
            background: #fff;
            color: var(--primary);
        }

        /* ============ POPUP ============ */
        .popup-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .popup-overlay.active {
            display: flex;
        }

        .popup-content {
            background: #fff;
            border-radius: 20px;
            padding: 36px 40px;
            text-align: center;
            max-width: 360px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .popup-content h2 {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 10px;
        }

        .popup-content p {
            font-size: 15px;
            color: var(--text-muted);
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .popup-content button {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 12px 36px;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.25s;
        }

        .popup-content button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(108,61,232,0.35);
        }

        /* ============ DARK MODE ============ */
        body.dark-mode {
            --bg: #0f0f1a;
            --text-dark: #f0f0f8;
            --text-muted: #9090b0;
            background-color: var(--bg);
        }

        body.dark-mode .container {
            background: #1a1a2e;
            box-shadow: 0 20px 60px rgba(108,61,232,0.35);
        }

        body.dark-mode .input-group input {
            background: #141428;
            border-color: #2a2a4e;
            color: var(--text-dark);
        }

        body.dark-mode .input-group input:focus {
            background: #1e1e38;
            border-color: var(--primary);
        }

        body.dark-mode .social-btn {
            background: #141428;
            border-color: #2a2a4e;
            color: #fff;
        }

        /* GitHub icon is near-black — invert it in dark mode */
        body.dark-mode .social-btn[title="GitHub"] svg path {
            fill: #e0e0e0;
        }

        body.dark-mode .popup-content {
            background: #1a1a2e;
        }

        body.dark-mode .popup-content h2, body.dark-mode .popup-content p {
            color: var(--text-dark);
        }

        body.dark-mode .toolbar-btn {
            background: rgba(30,30,60,0.85);
            color: var(--accent);
            border-color: rgba(108,61,232,0.3);
        }

        /* ============ RESPONSIVE ============ */
        @media (max-width: 700px) {
            body { padding: 10px; }

            .container {
                min-height: 640px;
                flex-direction: column;
                width: 100%;
                max-width: 420px;
            }

            /* On mobile: full-width forms, positioned by top */
            .form-box {
                width: 100%;
                padding: 36px 24px;
                min-height: 420px;
                position: absolute;
                /* Reset desktop left-based positions */
                left: 0 !important;
                transition: top var(--transition), opacity var(--transition);
            }

            .overlay-box {
                width: 100%;
                left: 0 !important; /* Reset desktop left */
                top: auto;
                bottom: 0;
                height: 200px;
                border-radius: 20px 20px 0 0;
                padding: 24px 24px;
                flex-direction: column;
                transition: top var(--transition), bottom var(--transition), border-radius 0.3s;
            }

            /* Active mobile: overlay moves to top */
            .container.active .overlay-box {
                top: 0 !important;
                bottom: auto;
                border-radius: 0 0 20px 20px;
            }

            /* Login form: visible at top */
            .form-box.login-box {
                top: 0;
                opacity: 1;
                z-index: 2;
            }

            /* Signup form: initially hidden below visible area */
            .form-box.signup-box {
                top: 0;
                opacity: 0;
                z-index: 1;
            }

            /* Active: hide login (slide below 200px overlay) */
            .container.active .form-box.login-box {
                top: 100%;
                opacity: 0;
                z-index: 1;
            }

            /* Active: show signup below overlay */
            .container.active .form-box.signup-box {
                top: 200px;
                opacity: 1;
                z-index: 2;
            }

            .overlay-logo { font-size: 28px; }
            .overlay-box h2 { font-size: 18px; }
            .overlay-box p { display: none; }
        }

        /* Loading state */
        .submit-btn.loading {
            opacity: 0.7;
            pointer-events: none;
        }

        .submit-btn.loading::after {
            content: ' ●●●';
            animation: dots 1.2s steps(3, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: ' ●'; }
            40% { content: ' ●●'; }
            60%, 100% { content: ' ●●●'; }
        }
    </style>
</head>
<body>

    <!-- Top toolbar -->
    <div class="toolbar">
        <button id="langToggle" class="toolbar-btn" onclick="toggleLanguage()" data-i18n="btn_language">🌍 English</button>
        <button id="darkModeToggle" class="toolbar-btn" data-i18n="btn_dark_mode">🌙 الوضع المظلم</button>
    </div>

    <!-- ===== MAIN CONTAINER ===== -->
    <div class="container" id="mainContainer">

        <!-- LOGIN FORM -->
        <div class="form-box login-box" id="loginBox">
            <div class="form-content">
                <h1 data-i18n="auth_signin_title">تسجيل الدخول</h1>

                <div class="social-row">

                    </div>
                    <!-- LinkedIn -->
                    <div class="social-btn" title="LinkedIn">

                    </div>
                </div>

                <span class="or-divider" data-i18n="auth_or_email">أو استخدم بريدك الإلكتروني</span>

                <form id="loginForm" style="width:100%; display:flex; flex-direction:column; gap:14px; align-items:center;">
                    <div class="input-group">
                        <input type="email" id="loginEmail" required placeholder="البريد الإلكتروني" data-i18n-placeholder="lbl_email" dir="auto">

                    <div class="input-group">
                        <input type="password" id="loginPass" required placeholder="كلمة المرور" data-i18n-placeholder="lbl_password" dir="auto">

                    <a class="forgot-link" href="#" data-i18n="lnk_forgot_password">نسيت كلمة المرور؟</a>

        </div>

        <!-- SIGNUP FORM -->
        <div class="form-box signup-box" id="signupBox">
            <div class="form-content">
                <h1 data-i18n="auth_create_account">إنشاء حساب</h1>

                <div class="social-row">
                    <!-- Google -->

                        </svg>
                    </div>
                    <!-- Facebook -->
                    <div class="social-btn" title="Facebook">
                        <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" fill="#1877F2"/>
                        </svg>
                    </div>
                    <!-- GitHub -->
                    <div class="social-btn" title="GitHub">
                        <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12" fill="#181717"/>
                        </svg>
                    </div>
                    <!-- LinkedIn -->
                    <div class="social-btn" title="LinkedIn">
                        <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z" fill="#0A66C2"/>
                        </svg>
                    </div>
                </div>

                <span class="or-divider" data-i18n="auth_or_email">أو استخدم بريدك الإلكتروني</span>

                <form id="signupForm" style="width:100%; display:flex; flex-direction:column; gap:14px; align-items:center;">
                    <div class="input-group">
                        <input type="text" id="signupName" required placeholder="الاسم الكامل" data-i18n-placeholder="lbl_fullname" dir="auto">
                    </div>
                    <div class="input-group">
                        <input type="email" id="signupEmail" required placeholder="البريد الإلكتروني" data-i18n-placeholder="lbl_email" dir="auto">
                    </div>
                    <div class="input-group">
                        <input type="password" id="signupPass" required placeholder="كلمة المرور" data-i18n-placeholder="lbl_password" dir="auto">
                    </div>
                    <div id="pwdStrength" class="pwd-strength"></div>
                    <div class="input-group">
                        <input type="password" id="signupConfirm" required placeholder="تأكيد كلمة المرور" data-i18n-placeholder="lbl_confirm_password" dir="auto">
                    </div>

                    <button type="submit" class="submit-btn" id="signupSubmitBtn" data-i18n="btn_submit_signup">إنشاء حساب</button>
                </form>
            </div>
        </div>

        <!-- SLIDING OVERLAY -->
        <div class="overlay-box" id="overlayBox">
            <div class="overlay-content">

                <!-- Panel shown when on LOGIN (prompts to Sign Up) -->
                <div class="overlay-panel show" id="overlayLoginPanel">
                    <div class="overlay-logo">🧠</div>
                    <h2 data-i18n="overlay_hello_friend">أهلاً يا صديق!</h2>
                    <p data-i18n="overlay_register_details">أدخل بياناتك الشخصية وابدأ رحلتك معنا</p>
                    <button class="overlay-toggle-btn" id="toSignupBtn" data-i18n="auth_tab_signup">تسجيل</button>
                </div>

                <!-- Panel shown when on SIGNUP (prompts to Sign In) -->
                <div class="overlay-panel" id="overlaySignupPanel">
                    <div class="overlay-logo">✨</div>
                    <h2 data-i18n="overlay_welcome_back">مرحباً بعودتك!</h2>
                    <p data-i18n="overlay_signin_details">سجّل دخولك للاستمرار في رحلتك مع فكرني</p>
                    <button class="overlay-toggle-btn" id="toLoginBtn" data-i18n="auth_tab_login">دخول</button>
                </div>

            </div>
        </div>

    </div><!-- /container -->

    <!-- ===== POPUP ===== -->
    <div class="popup-overlay" id="customPopup">
        <div class="popup-content">
            <h2 id="popupTitle"></h2>
            <p id="popupMessage"></p>
            <button data-action="closePopup" type="button" data-i18n="btn_ok">تمام</button>
        </div>
    </div>

    <script>
        // ============ TOGGLE PANELS ============
        const container   = document.getElementById('mainContainer');
        const toSignupBtn = document.getElementById('toSignupBtn');
        const toLoginBtn  = document.getElementById('toLoginBtn');
        const panelLogin  = document.getElementById('overlayLoginPanel');
        const panelSignup = document.getElementById('overlaySignupPanel');

        toSignupBtn.addEventListener('click', () => {
            container.classList.add('active');
            panelLogin.classList.remove('show');
            panelSignup.classList.add('show');
        });

        toLoginBtn.addEventListener('click', () => {
            container.classList.remove('active');
            panelSignup.classList.remove('show');
            panelLogin.classList.add('show');
        });

        // ============ OAUTH SOCIAL LOGIN ============
        // Wire up all social buttons to redirect to backend OAuth endpoint
        document.querySelectorAll('.social-btn').forEach(btn => {
            btn.style.cursor = 'pointer';
            btn.addEventListener('click', () => {
                const provider = btn.getAttribute('title').toLowerCase();
                window.location.href = `/api/auth/login/${provider}`;
            });
        });

        // On page load: check if returned from OAuth with ?token=...
        (function handleOAuthReturn() {
            const params = new URLSearchParams(window.location.search);
            const token   = params.get('token');
            const error   = params.get('oauth_error');
            const dest    = params.get('dest') || '/home.html';

            if (error) {
                // Clean URL then show error popup
                history.replaceState({}, '', '/login.html');
                setTimeout(() => showPopup('خطأ في تسجيل الدخول ⚠️', decodeURIComponent(error)), 200);
                return;
            }

            if (token) {
                // Save to localStorage exactly like normal login
                localStorage.setItem('access_token', token);
                localStorage.setItem('token',        token);
                localStorage.setItem('user_name',    decodeURIComponent(params.get('name')  || ''));
                localStorage.setItem('user_email',   decodeURIComponent(params.get('email') || ''));
                localStorage.setItem('user_id',      params.get('user_id') || '');
                // Clean the URL then navigate
                history.replaceState({}, '', '/login.html');
                showPopup('نجاح! ✅', 'تم تسجيل الدخول بنجاح. جاري التحميل...');
                setTimeout(() => window.location.href = dest, 1500);
            }
        })();

        // ============ POPUP ============
        function showPopup(title, msg) {
            document.getElementById('popupTitle').innerText = title;
            document.getElementById('popupMessage').innerText = msg;
            document.getElementById('customPopup').classList.add('active');
        }

        document.querySelector('[data-action="closePopup"]').addEventListener('click', () => {
            document.getElementById('customPopup').classList.remove('active');
        });

        // ============ CUSTOM VALIDITY ============
        const allInputs = document.querySelectorAll('input[required]');
        allInputs.forEach(input => {
            input.addEventListener('invalid', function() {
                if (this.validity.valueMissing) {
                    if (this.type === 'email') {
                        this.setCustomValidity('نسيت تكتب الإيميل يا صاحبي! 📧');
                    } else if (this.type === 'password') {
                        this.setCustomValidity('مفيش حساب من غير باسورد يا بطل! 🔒');
                    } else if (this.type === 'text') {
                        this.setCustomValidity('اكتب اسمك عشان أعرف أناديك! 🤝');
                    } else {
                        this.setCustomValidity('الخانة دي فاضية، ركز معايا! 😅');
                    }
                } else if (this.validity.typeMismatch && this.type === 'email') {
                    this.setCustomValidity('ده مش شكل إيميل خالص، راجعه تاني! 🧐');
                }
            });
            input.addEventListener('input', function() { this.setCustomValidity(''); });
        });

        // ============ PASSWORD STRENGTH ============
        const pwdInput    = document.getElementById('signupPass');
        const pwdStrength = document.getElementById('pwdStrength');

        pwdInput.addEventListener('input', () => {
            const val = pwdInput.value;
            if (val.length === 0) { pwdStrength.style.display = 'none'; return; }
            pwdStrength.style.display = 'block';
            let score = 0;
            if (val.length >= 6) score++;
            if (val.length >= 8) score++;
            if (/[A-Z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;

            if (score <= 1) {
                pwdStrength.innerHTML = 'قوة كلمة المرور: <b>ضعيفة 🔴</b>';
                pwdStrength.style.color = '#ef4444';
            } else if (score <= 3) {
                pwdStrength.innerHTML = 'قوة كلمة المرور: <b>متوسطة 🟠</b>';
                pwdStrength.style.color = '#f97316';
            } else {
                pwdStrength.innerHTML = 'قوة كلمة المرور: <b>قوية 🟢</b>';
                pwdStrength.style.color = '#22c55e';
            }
        });

        // ============ LOGIN HANDLER ============
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginSubmitBtn');
            const email    = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPass').value.trim();
            btn.classList.add('loading');

            try {
                const response = await fetch('http://127.0.0.1:8000/api/auth/login?email=' + encodeURIComponent(email) + '&password=' + encodeURIComponent(password), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('token',        data.access_token);
                    localStorage.setItem('user_name',    data.name || data.full_name);
                    localStorage.setItem('user_email',   data.email);
                    localStorage.setItem('user_id',      data.user_id);
                    showPopup('نجاح! ✅', 'تم تسجيل الدخول بنجاح. جاري التحميل...');
                    setTimeout(() => window.location.href = '/home.html', 2000);
                } else {
                    const error = await response.json();
                    let errorMsg = 'فشل تسجيل الدخول';
                    if (error.detail) errorMsg = Array.isArray(error.detail) ? error.detail[0].msg : error.detail;
                    showPopup('خطأ', errorMsg);
                }
            } catch (err) {
                showPopup('خطأ اتصال', 'تعذر الاتصال بالخادم');
            } finally {
                btn.classList.remove('loading');
            }
        });

        // ============ SIGNUP HANDLER ============
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn  = document.getElementById('signupSubmitBtn');
            const name     = document.getElementById('signupName').value.trim();
            const email    = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPass').value.trim();
            const confirm  = document.getElementById('signupConfirm').value.trim();

            if (password !== confirm) {
                showPopup('خطأ', 'كلمات المرور غير متطابقة، ركز يا بطل!');
                return;
            }

            btn.classList.add('loading');
            try {
                const response = await fetch('http://127.0.0.1:8000/api/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, full_name: name, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('token',        data.access_token);
                    localStorage.setItem('user_name',    data.name || data.full_name);
                    localStorage.setItem('user_email',   data.email);
                    localStorage.setItem('user_id',      data.user_id);
                    showPopup('نجاح! ✅', 'تم إنشاء الحساب بنجاح. يلا بينا على جلسة التعارف!');
                    setTimeout(() => window.location.href = '/learning-interview.html', 2000);
                } else {
                    const error = await response.json();
                    let errorMsg = 'فشل إنشاء الحساب';
                    if (error.detail) errorMsg = Array.isArray(error.detail) ? error.detail[0].msg : error.detail;
                    showPopup('خطأ', errorMsg);
                }
            } catch (err) {
                showPopup('خطأ اتصال', 'تعذر الاتصال بالخادم');
            } finally {
                btn.classList.remove('loading');
            }
        });

        // ============ DARK MODE ============
        const darkModeToggle = document.getElementById('darkModeToggle');
        const body = document.body;
        const currentTheme = localStorage.getItem('theme') || 'light';
        if (currentTheme === 'dark') {
            body.classList.add('dark-mode');
            darkModeToggle.textContent = '☀️ الوضع الفاتح';
        }
        darkModeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            const curLang = localStorage.getItem('lang') || 'ar';
            if (body.classList.contains('dark-mode')) {
                localStorage.setItem('theme', 'dark');
                darkModeToggle.textContent = curLang === 'en' ? '☀️ Light Mode' : '☀️ الوضع الفاتح';
            } else {
                localStorage.setItem('theme', 'light');
                darkModeToggle.textContent = curLang === 'en' ? '🌙 Dark Mode' : '🌙 الوضع المظلم';
            }
        });
    </script>

    <script src="../js/buttonManager.js"></script>
    <script src="../js/i18n.js"></script>

</body>
</html>
