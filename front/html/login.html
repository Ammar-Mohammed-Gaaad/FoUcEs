<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - فكرني</title>
    <link rel="stylesheet" href="../css/styles.css?v=3">
</head>
<body class="auth-page" style="display: flex; align-items: center; justify-content: center;">
    <div class="wrapper">
        <div style="text-align: center; margin-bottom: 20px;">
            <button id="langToggle" class="btn btn-secondary" style="padding: 8px 16px; font-size: 14px; margin-left: 10px;" onclick="toggleLanguage()" data-i18n="btn_language">🌍 English</button>
            <button id="darkModeToggle" class="btn btn-secondary" style="padding: 8px 16px; font-size: 14px;" data-i18n="btn_dark_mode">🌙 الوضع المظلم</button>
        </div>
        <div class="title-text">
            <div class="title login" data-i18n="auth_welcome_login">فكرني معاك</div>
            <div class="title signup" data-i18n="auth_welcome_signup">حساب جديد</div>
        </div>
        
        <div class="form-container">
            <div class="slide-controls">
                <input type="radio" name="slide" id="login" checked>
                <input type="radio" name="slide" id="signup">
                <label for="login" class="slide login" data-i18n="auth_tab_login">دخول</label>
                <label for="signup" class="slide signup" data-i18n="auth_tab_signup">تسجيل</label>
                <div class="slider-tab"></div>
            </div>
            
            <div class="form-inner">
                <form id="loginForm" class="login">
                    <div class="field">
                        <input type="email" id="loginEmail" required placeholder=" " dir="auto">
                        <label data-i18n="lbl_email">البريد الإلكتروني</label>
                    </div>
                    <div class="field">
                        <input type="password" id="loginPass" required placeholder=" " dir="auto">
                        <label data-i18n="lbl_password">كلمة المرور</label>
                    </div>
                    <div class="pass-link"><a href="#" data-i18n="lnk_forgot_password">نسيت كلمة المرور؟</a></div>
                    <div class="field btn">
                        <div class="btn-layer"></div>
                        <input type="submit" value="دخول" data-i18n-placeholder="btn_submit_login">
                    </div>
                    <div class="signup-link"><span data-i18n="lnk_no_account">ليس لديك حساب؟</span> <a href="javascript:void(0);" id="slideSignupBtn" data-i18n="click_here">اضغط هنا</a></div>
                </form>

                <form id="signupForm" class="signup">
                    <div class="field">
                        <input type="text" id="signupName" required placeholder=" " dir="auto">
                        <label data-i18n="lbl_fullname">الاسم الكامل</label>
                    </div>
                    <div class="field">
                        <input type="email" id="signupEmail" required placeholder=" " dir="auto">
                        <label data-i18n="lbl_email">البريد الإلكتروني</label>
                    </div>
                    <div class="field">
                        <input type="password" id="signupPass" required placeholder=" " dir="auto">
                        <label data-i18n="lbl_password">كلمة المرور</label>
                    </div>
                    <div id="pwdStrength" style="font-size: 12px; margin-top: -15px; margin-bottom: 15px; text-align: right; display: none; transition: 0.3s;"></div>
                    <div class="field">
                        <input type="password" id="signupConfirm" required placeholder=" " dir="auto">
                        <label data-i18n="lbl_confirm_password">تأكيد كلمة المرور</label>
                    </div>
                    <div class="field btn">
                        <div class="btn-layer"></div>
                        <input type="submit" value="إنشاء حساب" data-i18n-placeholder="btn_submit_signup">
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="popup-overlay" id="customPopup">
        <div class="popup-content">
            <h2 id="popupTitle"></h2>
            <p id="popupMessage"></p>
            <button data-action="closePopup" type="button" data-i18n="btn_ok">تمام</button>
        </div>
    </div>

    <script>
        // لوجيك الواجهة (UI/UX)
        const loginText = document.querySelector(".title-text .login");
        const loginForm = document.querySelector("form.login");
        const loginRadio = document.getElementById("login");
        const signupRadio = document.getElementById("signup");
        const signupLinkBtn = document.getElementById("slideSignupBtn");

        signupRadio.addEventListener("change", () => {
            loginForm.style.marginRight = "-50%";
            loginText.style.marginRight = "-50%";
        });

        loginRadio.addEventListener("change", () => {
            loginForm.style.marginRight = "0%";
            loginText.style.marginRight = "0%";
        });

        signupLinkBtn.onclick = (() => {
            signupRadio.checked = true; 
            signupRadio.dispatchEvent(new Event('change')); 
            return false;
        });

        function showPopup(title, msg) {
            document.getElementById('popupTitle').innerText = title;
            document.getElementById('popupMessage').innerText = msg;
            document.getElementById('customPopup').classList.add('active');
        }

        // رسايل المتصفح المخصصة
        const allInputs = document.querySelectorAll('input[required]');
        allInputs.forEach(input => {
            input.addEventListener('invalid', function() {
                if (this.validity.valueMissing) { 
                    if (this.type === 'email') {
                        this.setCustomValidity('نسيت تكتب الإيميل يا صاحبي! 📧');
                    } else if (this.type === 'password') {
                        this.setCustomValidity('مفيش حساب من غير باسورد يا بطل! 🔒');
                    } else if (this.type === 'text') {
                        this.setCustomValidity('اكتب اسمك عشان أعرف أناديك! 🤝');
                    } else {
                        this.setCustomValidity('الخانة دي فاضية، ركز معايا! 😅');
                    }
                } else if (this.validity.typeMismatch && this.type === 'email') { 
                    this.setCustomValidity('ده مش شكل إيميل خالص، راجعه تاني! 🧐');
                }
            });

            input.addEventListener('input', function() {
                this.setCustomValidity(''); 
            });
        });

        // ===== PASSWORD STRENGTH HANDLER =====
        const pwdInput = document.getElementById('signupPass');
        const pwdStrength = document.getElementById('pwdStrength');

        pwdInput.addEventListener('input', () => {
            const val = pwdInput.value;
            if (val.length === 0) {
                pwdStrength.style.display = 'none';
                return;
            }
            pwdStrength.style.display = 'block';
            let score = 0;
            if (val.length >= 6) score += 1;
            if (val.length >= 8) score += 1;
            if (/[A-Z]/.test(val)) score += 1;
            if (/[0-9]/.test(val)) score += 1;
            if (/[^A-Za-z0-9]/.test(val)) score += 1;

            if (score <= 1) {
                pwdStrength.innerHTML = 'قوة كلمة المرور: <b>ضعيفة 🔴</b>';
                pwdStrength.style.color = 'var(--danger)';
            } else if (score <= 3) {
                pwdStrength.innerHTML = 'قوة كلمة المرور: <b>متوسطة 🟠</b>';
                pwdStrength.style.color = 'var(--warning)';
            } else {
                pwdStrength.innerHTML = 'قوة كلمة المرور: <b>قوية 🟢</b>';
                pwdStrength.style.color = 'var(--primary)';
            }
        });

        // ===== LOGIN HANDLER =====
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPass').value.trim();

            try {
                const response = await fetch('http://127.0.0.1:8000/api/auth/login?email=' + encodeURIComponent(email) + '&password=' + encodeURIComponent(password), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (response.ok) {
                    const data = await response.json();
                    
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('user_name', data.name || data.full_name);
                    localStorage.setItem('user_email', data.email);
                    localStorage.setItem('user_id', data.user_id);
                    
                    console.log('✅ تم حفظ البيانات:', {
                        name: data.name,
                        email: data.email,
                        user_id: data.user_id
                    });
                    
                    showPopup('نجاح! ✅', 'تم تسجيل الدخول بنجاح. جاري التحميل...');
                    setTimeout(() => window.location.href = '/home.html', 2000);
                } else {
                    const error = await response.json();
                    let errorMsg = 'فشل تسجيل الدخول';
                    if (error.detail) {
                        errorMsg = Array.isArray(error.detail) ? error.detail[0].msg : error.detail;
                    }
                    showPopup('خطأ', errorMsg);
                }
            } catch (err) {
                showPopup('خطأ اتصال', 'تعذر الاتصال بالخادم');
            }
        });

        // ===== SIGNUP HANDLER =====
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPass').value.trim();
            const confirm = document.getElementById('signupConfirm').value.trim();

            if (password !== confirm) {
                showPopup('خطأ', 'كلمات المرور غير متطابقة، ركز يا بطل!');
                return;
            }

            try {
                const response = await fetch('http://127.0.0.1:8000/api/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, full_name: name, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('user_name', data.name || data.full_name);
                    localStorage.setItem('user_email', data.email);
                    localStorage.setItem('user_id', data.user_id);
                    
                    console.log('✅ تم حفظ البيانات:', {
                        name: data.name,
                        email: data.email,
                        user_id: data.user_id
                    });
                    
                    showPopup('نجاح! ✅', 'تم إنشاء الحساب بنجاح. يلا بينا على جلسة التعارف!');
                    setTimeout(() => window.location.href = '/learning-interview.html', 2000);
                } else {
                    const error = await response.json();
                    let errorMsg = 'فشل إنشاء الحساب';
                    if (error.detail) {
                        errorMsg = Array.isArray(error.detail) ? error.detail[0].msg : error.detail;
                    }
                    showPopup('خطأ', errorMsg);
                }
            } catch (err) {
                showPopup('خطأ اتصال', 'تعذر الاتصال بالخادم');
            }
        });
    </script>

    <script src="../js/buttonManager.js"></script>

    <script>
        // Dark Mode Toggle
        const darkModeToggle = document.getElementById('darkModeToggle');
        const body = document.body;

        const currentTheme = localStorage.getItem('theme') || 'light';
        if (currentTheme === 'dark') {
            body.classList.add('dark-mode');
            darkModeToggle.textContent = '☀️ الوضع الفاتح';
        }

        darkModeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            
            if (body.classList.contains('dark-mode')) {
                localStorage.setItem('theme', 'dark');
                let curLang = localStorage.getItem('lang') || 'ar';
                darkModeToggle.textContent = curLang === 'en' ? '☀️ Light Mode' : '☀️ الوضع الفاتح';
            } else {
                localStorage.setItem('theme', 'light');
                let curLang = localStorage.getItem('lang') || 'ar';
                darkModeToggle.textContent = curLang === 'en' ? '🌙 Dark Mode' : '🌙 الوضع المظلم';
            }
        });
    </script>
    <script src="../js/i18n.js"></script>
</body>
</html>
