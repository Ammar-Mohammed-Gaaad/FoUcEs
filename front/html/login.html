<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - فكرني</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="wrapper">
        <div style="text-align: center; margin-bottom: 20px;">
            <button id="darkModeToggle" class="btn btn-secondary" style="padding: 8px 16px; font-size: 14px;">🌙 الوضع المظلم</button>
        </div>
        <div class="title-text">
            <div class="title login">فكرني معاك</div>
            <div class="title signup">حساب جديد</div>
        </div>
        
        <div class="form-container">
            <div class="slider-container">
                <button type="button" class="slider-btn active" id="btn-login" onclick="toggleAuth('login')">دخول</button>
                <button type="button" class="slider-btn" id="btn-register" onclick="toggleAuth('signup')">تسجيل</button>
                <div class="slider-active-bg" style="right: 5px; left: auto;"></div>
            </div>
            
            <div class="form-inner">
                <form id="loginForm" class="login">
                    <div class="field">
                        <input type="email" id="loginEmail" required placeholder=" " dir="auto">
                        <label>البريد الإلكتروني</label>
                    </div>
                    <div class="field">
                        <input type="password" id="loginPass" required placeholder=" " dir="auto">
                        <label>كلمة المرور</label>
                    </div>
                    <div class="field btn" style="margin-top: 20px;">
                        <input type="submit" class="primary-btn" value="دخول">
                    </div>
                    <div class="signup-link">ليس لديك حساب؟ <a href="javascript:void(0);" id="slideSignupBtn">اضغط هنا</a></div>
                </form>

                <form id="signupForm" class="signup">
                    <div class="field">
                        <input type="text" id="signupName" required placeholder=" " dir="auto">
                        <label>الاسم الكامل</label>
                    </div>
                    <div class="field">
                        <input type="email" id="signupEmail" required placeholder=" " dir="auto">
                        <label>البريد الإلكتروني</label>
                    </div>
                    <div class="field">
                        <input type="password" id="signupPass" required placeholder=" " dir="auto">
                        <label>كلمة المرور</label>
                    </div>
                    <div class="field">
                        <input type="password" id="signupConfirm" required placeholder=" " dir="auto">
                        <label>تأكيد كلمة المرور</label>
                    </div>
                    <div class="field btn" style="margin-top: 20px;">
                        <input type="submit" class="primary-btn" value="إنشاء حساب">
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="popup-overlay" id="customPopup">
        <div class="popup-content">
            <h2 id="popupTitle"></h2>
            <p id="popupMessage"></p>
            <button data-action="closePopup" type="button">تمام</button>
        </div>
    </div>

    <script>
        // لوجيك الواجهة (UI/UX)
        const loginText = document.querySelector(".title-text .login");
        const loginForm = document.querySelector("form.login");
        const signupLinkBtn = document.getElementById("slideSignupBtn");

        function toggleAuth(mode) {
            const container = document.querySelector('.slider-container');
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('signupForm');
            const loginBtn = document.getElementById('btn-login');
            const registerBtn = document.getElementById('btn-register');

            if (mode === 'login') {
                container.classList.remove('register-active');
                loginBtn.classList.add('active');
                registerBtn.classList.remove('active');
                loginForm.style.display = 'block';
                if(registerForm) registerForm.style.display = 'none';
            } else {
                container.classList.add('register-active');
                registerBtn.classList.add('active');
                loginBtn.classList.remove('active');
                if(loginForm) loginForm.style.display = 'none';
                if(registerForm) registerForm.style.display = 'block';
            }
        }

        window.toggleAuth = toggleAuth;

        signupLinkBtn.onclick = (() => {
            toggleAuth('signup'); 
            return false;
        });

        // Smart Button Glow Effect Logic
        const primaryBtns = document.querySelectorAll('.primary-btn');
        const docBody = document.body;

        primaryBtns.forEach(btn => {
            btn.addEventListener('mousemove', function(e) {
                if (!docBody.classList.contains('dark-mode')) {
                    const rect = btn.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    
                    btn.style.setProperty('--x', x + 'px');
                    btn.style.setProperty('--y', y + 'px');
                }
            });
        });

        function showPopup(title, msg) {
            document.getElementById('popupTitle').innerText = title;
            document.getElementById('popupMessage').innerText = msg;
            document.getElementById('customPopup').classList.add('active');
        }

        // رسايل المتصفح المخصصة
        const allInputs = document.querySelectorAll('input[required]');
        allInputs.forEach(input => {
            input.addEventListener('invalid', function() {
                if (this.validity.valueMissing) { 
                    if (this.type === 'email') {
                        this.setCustomValidity('نسيت تكتب الإيميل يا صاحبي! 📧');
                    } else if (this.type === 'password') {
                        this.setCustomValidity('مفيش حساب من غير باسورد يا بطل! 🔒');
                    } else if (this.type === 'text') {
                        this.setCustomValidity('اكتب اسمك عشان أعرف أناديك! 🤝');
                    } else {
                        this.setCustomValidity('الخانة دي فاضية، ركز معايا! 😅');
                    }
                } else if (this.validity.typeMismatch && this.type === 'email') { 
                    this.setCustomValidity('ده مش شكل إيميل خالص، راجعه تاني! 🧐');
                }
            });

            input.addEventListener('input', function() {
                this.setCustomValidity(''); 
            });
        });

        // ===== LOGIN HANDLER =====
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPass').value.trim();

            try {
                const response = await fetch('http://127.0.0.1:8000/api/auth/login?email=' + encodeURIComponent(email) + '&password=' + encodeURIComponent(password), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (response.ok) {
                    const data = await response.json();
                    
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('user_name', data.name || data.full_name);
                    localStorage.setItem('user_email', data.email);
                    localStorage.setItem('user_id', data.user_id);
                    
                    console.log('✅ تم حفظ البيانات:', {
                        name: data.name,
                        email: data.email,
                        user_id: data.user_id
                    });
                    
                    showPopup('نجاح! ✅', 'تم تسجيل الدخول بنجاح. جاري التحميل...');
                    setTimeout(() => window.location.href = '/home.html', 2000);
                } else {
                    const error = await response.json();
                    showPopup('خطأ', error.detail || 'حدث خطأ غير متوقع');
                }
            } catch (err) {
                showPopup('خطأ اتصال', 'تأكد من تشغيل السيرفر (Uvicorn)');
            }
        });

        // ===== SIGNUP HANDLER =====
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPass').value.trim();
            const confirm = document.getElementById('signupConfirm').value.trim();

            if (password !== confirm) {
                showPopup('خطأ', 'كلمات المرور غير متطابقة، ركز يا بطل!');
                return;
            }

            try {
                const response = await fetch('http://127.0.0.1:8000/api/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, full_name: name, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('user_name', data.name || data.full_name);
                    localStorage.setItem('user_email', data.email);
                    localStorage.setItem('user_id', data.user_id);
                    
                    console.log('✅ تم حفظ البيانات:', {
                        name: data.name,
                        email: data.email,
                        user_id: data.user_id
                    });
                    
                    showPopup('نجاح! ✅', 'تم إنشاء الحساب بنجاح. يلا بينا على جلسة التعارف!');
                    setTimeout(() => window.location.href = '/learning-interview.html', 2000);
                } else {
                    const error = await response.json();
                    showPopup('خطأ', error.detail || 'فشل إنشاء الحساب');
                }
            } catch (err) {
                showPopup('خطأ اتصال', 'تعذر الاتصال بالخادم');
            }
        });
    </script>

    <script src="../js/buttonManager.js"></script>

    <script>
        // Dark Mode Toggle
        const darkModeToggle = document.getElementById('darkModeToggle');
        const body = document.body;

        const currentTheme = localStorage.getItem('theme') || 'light';
        if (currentTheme === 'dark') {
            body.classList.add('dark-mode');
            darkModeToggle.textContent = '☀️ الوضع الفاتح';
        }

        darkModeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            
            if (body.classList.contains('dark-mode')) {
                localStorage.setItem('theme', 'dark');
                darkModeToggle.textContent = '☀️ الوضع الفاتح';
            } else {
                localStorage.setItem('theme', 'light');
                darkModeToggle.textContent = '🌙 الوضع المظلم';
            }
        });
    </script>
</body>
</html>
