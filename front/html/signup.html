<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حساب جديد - فكرني</title>
    <link rel="stylesheet" href="../css/styles.css?v=3">
</head>
<body class="auth-page" style="display: flex; align-items: center; justify-content: center;">
    <div class="wrapper">
        <div style="text-align: center; margin-bottom: 20px;">
            <button id="langToggle" class="btn btn-secondary" style="padding: 8px 16px; font-size: 14px; margin-left: 10px;" onclick="toggleLanguage()" data-i18n="btn_language">🌍 English</button>
            <button id="darkModeToggle" class="btn btn-secondary" style="padding: 8px 16px; font-size: 14px;" data-i18n="btn_dark_mode">🌙 الوضع المظلم</button>
        </div>
        <h1 class="header-title" data-i18n="auth_welcome_signup">حساب جديد</h1>
        <p class="header-subtitle" data-i18n="signup_subtitle">سجل دلوقتي وابدأ رحلتك مع فكرني 🚀</p>
        
        <div class="form-inner">
            <form id="signupForm">
                <div class="field">
                    <input type="text" id="signupName" required>
                    <label data-i18n="lbl_fullname">الاسم الكامل</label>
                </div>
                <div class="field">
                    <input type="email" id="signupEmail" required>
                    <label data-i18n="lbl_email">البريد الإلكتروني</label>
                </div>
                <div class="field">
                    <input type="password" id="signupPass" required>
                    <label data-i18n="lbl_password">كلمة المرور</label>
                </div>
                <div id="pwdStrength" style="font-size: 12px; margin-top: -15px; margin-bottom: 15px; text-align: right; display: none; transition: 0.3s;"></div>
                <div class="field">
                    <input type="password" id="signupConfirm" required>
                    <label data-i18n="lbl_confirm_password">تأكيد كلمة المرور</label>
                </div>
                
                <button type="submit" class="btn-submit" id="submitBtn" data-i18n="btn_submit_signup">إنشاء الحساب</button>
                
                <div class="login-link">
                    <span data-i18n="lnk_has_account">عندك حساب فعلاً؟</span> <a href="login.html" data-i18n="login_here">سجل دخول من هنا</a>
                </div>
            </form>
        </div>
    </div>

    <div id="customPopup" class="popup-overlay">
        <div class="popup-content">
            <h2 id="popupTitle"></h2>
            <p id="popupMessage"></p>
            <button id="popupOkBtn" data-i18n="btn_ok">تمام</button>
        </div>
    </div>

    <script>
        // دالة إظهار البوب أب
        function showPopup(title, msg) {
            document.getElementById('popupTitle').innerText = title;
            document.getElementById('popupMessage').innerText = msg;
            document.getElementById('customPopup').classList.add('active');
        }

        // إخفاء البوب أب
        document.getElementById('popupOkBtn').addEventListener('click', () => {
            document.getElementById('customPopup').classList.remove('active');
        });

        // ===== PASSWORD STRENGTH HANDLER =====
        const pwdInput = document.getElementById('signupPass');
        const pwdStrength = document.getElementById('pwdStrength');

        pwdInput.addEventListener('input', () => {
            const val = pwdInput.value;
            if (val.length === 0) {
                pwdStrength.style.display = 'none';
                return;
            }
            pwdStrength.style.display = 'block';
            let score = 0;
            if (val.length >= 6) score += 1;
            if (val.length >= 8) score += 1;
            if (/[A-Z]/.test(val)) score += 1;
            if (/[0-9]/.test(val)) score += 1;
            if (/[^A-Za-z0-9]/.test(val)) score += 1;

            if (score <= 1) {
                pwdStrength.innerHTML = 'قوة كلمة المرور: <b>ضعيفة 🔴</b>';
                pwdStrength.style.color = 'var(--danger)';
            } else if (score <= 3) {
                pwdStrength.innerHTML = 'قوة كلمة المرور: <b>متوسطة 🟠</b>';
                pwdStrength.style.color = 'var(--warning)';
            } else {
                pwdStrength.innerHTML = 'قوة كلمة المرور: <b>قوية 🟢</b>';
                pwdStrength.style.color = 'var(--primary)';
            }
        });

        // التعامل مع السيرفر عند الضغط على إنشاء حساب
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPass').value.trim();
            const confirm = document.getElementById('signupConfirm').value.trim();
            const submitBtn = document.getElementById('submitBtn');

            // التحقق من تطابق كلمة المرور
            if (password !== confirm) {
                showPopup('فكرني بيقولك 🤖', 'كلمات المرور مش زي بعض، ركز يا بطل!');
                return;
            }

            // إيقاف الزرار عشان اليوزر ميدوسش مرتين
            submitBtn.disabled = true;
            submitBtn.textContent = 'بجهزلك مكان... ⏳';

            try {
                // إرسال البيانات للباك إند (FastAPI)
                const response = await fetch('http://127.0.0.1:8000/api/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, full_name: name, password: password })
                });

                if (response.ok) {
                    const data = await response.json();
                    
                    // حفظ بيانات المستخدم
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('user_id', data.user_id);
                    localStorage.setItem('user_name', data.name);
                    localStorage.setItem('user_email', data.email);
                    
                    showPopup('عاش يا بطل! 🎉', 'تم إنشاء حسابك بنجاح. يلا بينا على جلسة التعارف!');
                    
                    // تحويل المستخدم لصفحة التعارف بعد ثانيتين
                    setTimeout(() => window.location.href = '/learning-interview.html', 2000);
                } else {
                    const error = await response.json();
                    showPopup('في حاجة غلط ⚠️', error.detail || 'مقدرتش أعمل الحساب، جرب بإيميل تاني.');
                }
            } catch (err) {
                showPopup('فصلت شحن! 🔌', 'تعذر الاتصال بالسيرفر، اتأكد من النت وجرب تاني.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'إنشاء الحساب';
            }
        });
    </script>

    <script>
        // Dark Mode Toggle
        const darkModeToggle = document.getElementById('darkModeToggle');
        const body = document.body;

        const currentTheme = localStorage.getItem('theme') || 'light';
        if (currentTheme === 'dark') {
            body.classList.add('dark-mode');
            darkModeToggle.textContent = '☀️ الوضع الفاتح';
        }

        darkModeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            
            if (body.classList.contains('dark-mode')) {
                localStorage.setItem('theme', 'dark');
                let curLang = localStorage.getItem('lang') || 'ar';
                darkModeToggle.textContent = curLang === 'en' ? '☀️ Light Mode' : '☀️ الوضع الفاتح';
            } else {
                localStorage.setItem('theme', 'light');
                let curLang = localStorage.getItem('lang') || 'ar';
                darkModeToggle.textContent = curLang === 'en' ? '🌙 Dark Mode' : '🌙 الوضع المظلم';
            }
        });
    </script>
    <script src="../js/i18n.js"></script>
</body>
</html>
