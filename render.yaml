services:
  - type: web
    name: fakarni
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd src && gunicorn main:app --workers 1 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./fakarni.db
